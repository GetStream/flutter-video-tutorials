name: livestreaming_tutorial
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.0
  permission_handler: ^12.0.1
  stream_video: ^1.6.0
  stream_video_flutter: ^1.6.0
  stream_webrtc_flutter: ^3.2.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Stream credentials, see env/env.example.json.
  assets:
    - env/
